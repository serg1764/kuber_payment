apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: payments
spec:
  selector:
    app: notification-service
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service-external
  namespace: payments
spec:
  type: NodePort
  selector:
    app: notification-service
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
      nodePort: 30090
