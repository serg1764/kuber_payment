apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: payments
spec:
  type: NodePort
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-external
  namespace: payments
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30432