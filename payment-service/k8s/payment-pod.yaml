apiVersion: v1
kind: Pod
metadata:
  name: payment-service-pod
  namespace: payments
  labels:
    app: payment-service
spec:
  containers:
    - name: payment-service
      image: payment-service:local
      imagePullPolicy: Never
      ports:
        - containerPort: 8080
      env:
        - name: APP_PORT
          value: "8080"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "payments_db"
        - name: DB_USER
          value: "payment_user"
        - name: DB_PASSWORD
          value: "payment_password"
